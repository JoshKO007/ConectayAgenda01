<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta y Agenda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/stylesInic.css">
</head>
<body>
    <header>
        <nav class="menu">     
            <ul class="menu-items">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Descargas</a></li>
                <li><a href="#">Características</a></li>
                <li><a href="#">Documentación</a></li>
                <li><a href="#">Notas de versión</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
            <!-- Aquí va el botón hamburguesa con el menú desplegable -->
            <div class="menu-hamburguesa">
                <i class="fas fa-bars"></i>
                <ul class="menu-desplegable"></ul> <!-- Menú oculto, solo aparece al hacer hover -->
            </div>       
            <div class="user-icon">
                <i class="fa-duotone fa-solid fa-user"></i>
            </div>
        </nav>
    </header>    

    <canvas id="particulas"></canvas>

    <div class="interruptor">
        <button id="cambiar-tema">
            <span class="texto-tema">Cambiar tema</span>
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="contenedor">
        <h1>Conecta y Agenda</h1>
        <p class="descripcion">
            Bienvenido a <strong>Conecta y Agenda</strong>, tu solución integral para la gestión de citas. 
            Organiza tus reuniones, eventos y tareas de manera eficiente y sencilla con nuestra plataforma.
        </p>
        <button class="boton-descargar">
            <i class="fas fa-download"></i> Descargar ahora
        </button>
    </div>

    
    <script src="JS/particulas.js"></script>
    <script>
        const cambiarTema = document.getElementById('cambiar-tema');
        const cuerpo = document.body;
        let esOscuro = false;

        cambiarTema.addEventListener('click', () => {
            esOscuro = !esOscuro;
            cuerpo.classList.toggle('tema-oscuro');
            cambiarTema.querySelector('i').classList = esOscuro 
                ? 'fas fa-sun' 
                : 'fas fa-moon';
            localStorage.setItem('tema', esOscuro ? 'oscuro' : 'claro');
        });

        const temaGuardado = localStorage.getItem('tema');
        if(temaGuardado === 'oscuro') {
            cuerpo.classList.add('tema-oscuro');
            cambiarTema.querySelector('i').classList = 'fas fa-sun';
            esOscuro = true;
        }
    </script>
    <script src="JS/menu.js"></script>
</body>
</html>
